name: Quality gates

on:
  push:
  pull_request:

jobs:
  raw-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/generate_raw_edc.py
      - run: python scripts/generate_extra_edc.py
      - run: git diff --exit-code -- data/raw
      - run: python scripts/validate_raw_contracts.py
      - run: python -m pytest -v
